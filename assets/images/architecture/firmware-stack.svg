<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
  <title id="title">ARM Cortex-M firmware stack</title>
  <desc id="desc">Application modules connect through device and peripheral drivers to GD32 SPL or STM32 HAL, CMSIS, and Cortex-M4 hardware.</desc>
  <rect width="1200" height="440" fill="#0d1117"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="70" y="58" fill="#e6edf3" font-size="28" font-weight="600">ARM Cortex-M firmware stack</text>
    <text x="70" y="88" fill="#8b949e" font-size="16">GD32F407 · STM32F407 · bare-metal peripheral projects</text>
    <g stroke="#30363d" stroke-width="2">
      <rect x="70" y="125" width="1060" height="50" rx="8" fill="#161b22"/>
      <rect x="70" y="195" width="1060" height="50" rx="8" fill="#161b22"/>
      <rect x="70" y="265" width="1060" height="50" rx="8" fill="#161b22"/>
      <rect x="70" y="335" width="1060" height="50" rx="8" fill="#161b22"/>
    </g>
    <g fill="#58a6ff" font-size="18" font-weight="600">
      <text x="95" y="157">Application</text>
      <text x="95" y="227">Modules</text>
      <text x="95" y="297">Peripheral framework</text>
      <text x="95" y="367">Cortex-M4 hardware</text>
    </g>
    <g fill="#c9d1d9" font-size="17">
      <text x="330" y="157">main · application state · initialization order</text>
      <text x="330" y="227">GPIO · EXTI · Timer · USART · I²C · SPI · ADC · RTC</text>
      <text x="330" y="297">GD32 SPL / STM32 HAL · CMSIS · startup</text>
      <text x="330" y="367">NVIC · SysTick · DMA · AHB/APB peripherals</text>
    </g>
    <g stroke="#58a6ff" stroke-width="3" fill="none">
      <path d="M600 175 V195"/>
      <path d="M600 245 V265"/>
      <path d="M600 315 V335"/>
    </g>
  </g>
</svg>

