<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Cortex-M firmware stack</title><desc id="desc">Application state descends through board modules, drivers, vendor libraries, and CMSIS into Cortex-M4 hardware.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8b949e"/></marker><style>.bg{fill:#0d1117}.grid{stroke:#30363d;opacity:.28}.box{stroke-width:2}.input{fill:#21262d;stroke:#8b949e}.core{fill:#0d419d;stroke:#58a6ff}.hardware{fill:#1f6f3d;stroke:#3fb950}.output{fill:#f0f6fc;stroke:#c9d1d9}.title{font:700 28px system-ui,sans-serif;fill:#f0f6fc}.sub{font:16px system-ui,sans-serif;fill:#8b949e}.label{font:700 17px system-ui,sans-serif;fill:#f0f6fc;text-anchor:middle}.detail{font:13px system-ui,sans-serif;fill:#c9d1d9;text-anchor:middle}.dark{fill:#0d1117}.arrow{fill:none;stroke:#8b949e;stroke-width:3;marker-end:url(#arrow)}</style></defs>
  <rect class="bg" width="1200" height="520" rx="22"/><path class="grid" d="M0 110H1200M0 410H1200M300 0V520M600 0V520M900 0V520"/>
  <text class="title" x="50" y="54">Cortex-M Firmware Stack</text><text class="sub" x="50" y="84">Application intent stays separate from board, driver, vendor, and core layers</text>
  <rect class="box input" x="430" y="125" width="340" height="58" rx="12"/><text class="label" x="600" y="161">Application / System State</text>
  <rect class="box core" x="370" y="200" width="460" height="58" rx="12"/><text class="label" x="600" y="236">Board Modules / Device Interfaces</text>
  <rect class="box core" x="310" y="275" width="580" height="58" rx="12"/><text class="label" x="600" y="311">Peripheral Drivers / Callbacks / DMA</text>
  <rect class="box hardware" x="250" y="350" width="700" height="58" rx="12"/><text class="label" x="600" y="386">GD32 SPL / STM32 HAL · CMSIS / Startup / NVIC</text>
  <rect class="box output" x="190" y="425" width="820" height="58" rx="12"/><text class="label dark" x="600" y="461">GD32F407 / STM32F407 · ARM Cortex-M4 Hardware</text>
  <path class="arrow" d="M600 183V200M600 258V275M600 333V350M600 408V425"/>
</svg>
